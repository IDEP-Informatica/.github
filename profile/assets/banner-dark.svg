<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="IDEP Informática — trabajadoras y trabajadores informáticos del Estado bonaerense">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .l { opacity: 0; animation: show .01s forwards; }
  .l1 { animation-delay: .3s } .l2 { animation-delay: 1.1s } .l3 { animation-delay: 1.9s }
  .l4 { animation-delay: 2.7s } .l5 { animation-delay: 3.5s } .l6 { animation-delay: 4.3s }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes show { to { opacity: 1 } }
  @keyframes blink { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .l { opacity: 1; animation: none } .cursor { animation: none } }
</style>
<rect width="1200" height="380" rx="16" fill="#0d1117"/>
<!-- grilla de fondo -->
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d"/></pattern></defs>
<rect width="1200" height="380" rx="16" fill="url(#g)" opacity=".6"/>

<!-- título -->
<text x="60" y="112" class="sans" font-size="54" font-weight="800" fill="#e6edf3">IDEP <tspan fill="#3fb950">Informática</tspan></text>
<text x="62" y="150" class="sans" font-size="20" fill="#8b949e">Trabajadoras y trabajadores informáticos</text>
<text x="62" y="176" class="sans" font-size="20" fill="#8b949e">del Estado bonaerense</text>
<text x="62" y="214" class="mono" font-size="14" fill="#58a6ff">IDEP · ATE Provincia de Buenos Aires · CTA Autónoma</text>
<g class="mono" font-size="15" fill="#8b949e">
  <text x="62" y="300">soberanía tecnológica</text>
  <text x="62" y="326">software libre · formación</text>
  <text x="62" y="352">organización colectiva</text>
</g>
<rect x="62" y="262" width="56" height="4" rx="2" fill="#3fb950"/>

<!-- terminal -->
<g transform="translate(660 40)">
  <rect width="500" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h480a10 10 0 0 1 10 10v24H0z" fill="#30363d" opacity=".5"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="250" y="22" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">idep@pba: ~</text>
  <g class="mono" font-size="15">
    <text x="20" y="66" class="l l1"><tspan fill="#3fb950">idep@pba</tspan><tspan fill="#8b949e">:~$</tspan><tspan fill="#e6edf3"> cat preguntas.txt</tspan></text>
    <text x="20" y="96" class="l l2" fill="#e6edf3"><tspan fill="#d29922">1</tspan>  ¿Quién la controla?</text>
    <text x="20" y="122" class="l l3" fill="#e6edf3"><tspan fill="#d29922">2</tspan>  ¿Con qué datos funciona?</text>
    <text x="20" y="148" class="l l4" fill="#e6edf3"><tspan fill="#d29922">3</tspan>  ¿A quién beneficia?</text>
    <text x="20" y="196" class="l l5"><tspan fill="#3fb950">idep@pba</tspan><tspan fill="#8b949e">:~$</tspan><tspan fill="#e6edf3"> echo $FUTURO</tspan></text>
    <text x="20" y="226" class="l l6" fill="#58a6ff">Queremos escribirlo nosotros.</text>
    <g class="l l6"><text x="20" y="268"><tspan fill="#3fb950">idep@pba</tspan><tspan fill="#8b949e">:~$</tspan></text>
    <rect x="128" y="254" width="9" height="18" fill="#3fb950" class="cursor"/></g>
  </g>
</g>
</svg>
